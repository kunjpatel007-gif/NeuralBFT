<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>NeuralBFT - Immersive 3D Mode</title>
    <link rel="icon" href="favicon-3d.svg" type="image/svg+xml">
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #080A10; }
      #unity-canvas { width: 100%; height: 100%; display: block; }
      #unity-loading-bar { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; }
      #unity-progress-bar-empty { width: 200px; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden; }
      #unity-progress-bar-full { width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
    
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/unity_web_build.loader.js";
      var config = {
        dataUrl: buildUrl + "/unity_web_build.data",
        frameworkUrl: buildUrl + "/unity_web_build.framework.js",
        codeUrl: buildUrl + "/unity_web_build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "NeuralBFT",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio, 1.5),
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          window.unityInstance = unityInstance;
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert("Unity Error: " + message);
        });
      };
      document.body.appendChild(script);
    </script>
    <script src="app3d.js"></script>
  </body>
</html>
