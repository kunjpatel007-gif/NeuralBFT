<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consensus Arena Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <span class="name">Consensus Arena</span>
  <span class="stat">Round <b id="round">0</b></span>
  <span class="stat"><b id="consensus">-</b></span>
  <span class="stat"><b id="nodeCount">0</b> nodes</span>
  <span class="stat"><b id="tps">0</b> tps</span>
  <span class="link" id="link" data-state="connecting"><i></i><span id="status">Connecting</span></span>
</header>

<main class="layout">

  <aside class="controls">
    <section>
      <h2>Consensus</h2>
      <div class="seg" id="consensusButtons"></div>
    </section>

    <section>
      <h2>Fault</h2>
      <select id="nodeSelect" aria-label="Node"></select>
      <select id="faultSelect" aria-label="Fault type"></select>
      <button id="injectBtn" type="button" data-cmd>Inject</button>
    </section>

    <section>
      <h2>Network</h2>
      <button id="splitBtn" type="button" data-cmd>Sever Network</button>
    </section>

    <section>
      <h2>Scaling</h2>
      <div class="pair">
        <button id="addNodeBtn" type="button" data-cmd>+ Node</button>
        <button id="removeNodeBtn" type="button" data-cmd>- Node</button>
      </div>
    </section>
  </aside>

  <div class="map" id="mapPanel">
    <canvas id="arena"></canvas>
    <div class="overlay" id="mapOverlay"></div>
  </div>

  <aside class="side">
    <section id="nodeDetail" hidden>
      <div class="detail-head">
        <h2 id="detailTitle">—</h2>
        <button class="close" id="detailClose" type="button" aria-label="Close">×</button>
      </div>
      <dl class="rows">
        <dt>Reputation</dt><dd id="detailRep">—</dd>
        <dt>Status</dt><dd id="detailStatus">—</dd>
        <dt>Hardware</dt><dd id="detailProfile">—</dd>
        <dt>ML threat</dt><dd id="detailThreat">—</dd>
      </dl>
      <dl class="rows">
        <dt>Neural net</dt><dd id="detailNN">—</dd>
        <dt>Anomaly</dt><dd id="detailAnomaly">—</dd>
      </dl>
      <dl class="rows">
        <dt>Msg freq</dt><dd id="detailFreq">—</dd>
        <dt>Vote drift</dt><dd id="detailVote">—</dd>
        <dt>Latency</dt><dd id="detailLat">—</dd>
        <dt>Forks</dt><dd id="detailForks">—</dd>
        <dt>Silence</dt><dd id="detailSilence">—</dd>
      </dl>
      <div class="pair">
        <button id="fpBtn" type="button">False Positive</button>
        <button id="maBtn" type="button">Missed Attack</button>
      </div>
    </section>

    <section class="board">
      <h2>Reputation</h2>
      <div id="lbContent"></div>
    </section>
  </aside>

</main>

<footer class="ticker" id="ticker">Awaiting blocks</footer>

<script src="app.js"></script>
</body>
</html>
