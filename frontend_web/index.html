<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consensus Arena Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <span class="name">Consensus Arena</span>
  <span class="stat">Round <b id="round">0</b></span>
  <span class="stat"><b id="consensus">-</b></span>
  <span class="stat"><b id="nodeCount">0</b> nodes</span>
  <span class="stat"><b id="tps">0</b> tps</span>
  <span class="link" id="link" data-state="connecting"><i></i><span id="status">Connecting</span></span>
</header>

<main class="layout">

  <aside class="controls">
    <section>
      <h2>Consensus</h2>
      <div class="seg" id="consensusButtons"></div>
    </section>

    <section>
      <h2>Fault</h2>
      <select id="nodeSelect" aria-label="Node"></select>
      <select id="faultSelect" aria-label="Fault type"></select>
      <button id="injectBtn" type="button" data-cmd>Inject</button>
    </section>

    <section>
      <h2>Network</h2>
      <button id="splitBtn" type="button" data-cmd>Sever Network</button>
    </section>

    <section>
      <h2>Scaling</h2>
      <div class="pair">
        <button id="addNodeBtn" type="button" data-cmd>+ Node</button>
        <button id="removeNodeBtn" type="button" data-cmd>- Node</button>
      </div>
    </section>
  </aside>

  <div class="map" id="mapPanel" style="position: relative;">
    <!-- Old 2D Canvas (hidden in favor of 3D) -->
    <canvas id="arena" style="display: none;"></canvas>
    
    <!-- New Unity 3D WebGL Canvas -->
    <canvas id="unity-canvas" style="width: 100%; height: 100%; display: block;"></canvas>
    
    <!-- Custom Loading Bar for Unity -->
    <div id="unity-loading-bar" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;">
      <div id="unity-progress-bar-empty" style="width: 200px; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 5px; overflow: hidden;">
        <div id="unity-progress-bar-full" style="width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s;"></div>
      </div>
    </div>

    <div class="overlay" id="mapOverlay"></div>
  </div>

  <aside class="side">
    <section id="nodeDetail" hidden>
      <div class="detail-head">
        <h2 id="detailTitle">—</h2>
        <button class="close" id="detailClose" type="button" aria-label="Close">×</button>
      </div>
      <dl class="rows">
        <dt>Reputation</dt><dd id="detailRep">—</dd>
        <dt>Status</dt><dd id="detailStatus">—</dd>
        <dt>Hardware</dt><dd id="detailProfile">—</dd>
        <dt>ML threat</dt><dd id="detailThreat">—</dd>
      </dl>
      <dl class="rows">
        <dt>Neural net</dt><dd id="detailNN">—</dd>
        <dt>Anomaly</dt><dd id="detailAnomaly">—</dd>
      </dl>
      <dl class="rows">
        <dt>Msg freq</dt><dd id="detailFreq">—</dd>
        <dt>Vote drift</dt><dd id="detailVote">—</dd>
        <dt>Latency</dt><dd id="detailLat">—</dd>
        <dt>Forks</dt><dd id="detailForks">—</dd>
        <dt>Silence</dt><dd id="detailSilence">—</dd>
      </dl>
      <div class="pair">
        <button id="fpBtn" type="button">False Positive</button>
        <button id="maBtn" type="button">Missed Attack</button>
      </div>
    </section>

    <section class="board">
      <h2>Reputation</h2>
      <div id="lbContent"></div>
    </section>
  </aside>

</main>

<footer class="ticker" id="ticker">Awaiting blocks</footer>

<script src="Build/unity_web_build.loader.js"></script>
<script>
  if (typeof createUnityInstance !== 'undefined') {
      var canvas = document.querySelector("#unity-canvas");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingBar = document.querySelector("#unity-loading-bar");

      createUnityInstance(canvas, {
        dataUrl: "Build/unity_web_build.data",
        frameworkUrl: "Build/unity_web_build.framework.js",
        codeUrl: "Build/unity_web_build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "NeuralBFT",
        productVersion: "1.0",
      }, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert("Unity Error: " + message);
      });
  }
</script>
<script src="app.js"></script>
</body>
</html>
