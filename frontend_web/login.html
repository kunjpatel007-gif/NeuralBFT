<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Consensus Arena - Login</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 32px;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; margin-top: 0; font-weight: 300; }
        input[type="password"] {
            width: 100%; padding: 8px; margin: 16px 0;
            background-color: #0d1117; border: 1px solid #30363d;
            color: #c9d1d9; border-radius: 4px; box-sizing: border-box;
        }
        button {
            width: 100%; padding: 8px; background-color: #238636;
            color: #ffffff; border: none; border-radius: 4px;
            cursor: pointer; font-weight: 600;
        }
        button:hover { background-color: #2ea043; }
        .error { color: #ff7b72; font-size: 12px; text-align: center; display: none; margin-bottom: 10px;}
    </style>
</head>
<body>
    <div class="login-box">
        <h2>System Access</h2>
        <div id="error-msg" class="error">Invalid Access Token</div>
        <input type="password" id="token-input" placeholder="Enter Access Token" onkeypress="if(event.key === 'Enter') login()">
        <button onclick="login()">Authenticate</button>
    </div>
    <script>
        function login() {
            const token = document.getElementById('token-input').value;
            // Extremely basic client-side check just to route them, the REAL security is in the WebSocket backend.
            if (token.length > 5) {
                localStorage.setItem('arena_token', token);
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }
    </script>
</body>
</html>
